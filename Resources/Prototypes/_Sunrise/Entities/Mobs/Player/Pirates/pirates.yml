
# region Pirate
- type: entity
  name: Scooner spawner
  id: ScoonerReinforcementSpawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Structures/Decoration/banner.rsi
        state: banner_syndicate
  - type: RandomSpawner
    prototypes:
    - RandomHumanoidScoonerReinforcement

- type: entity
  id: RandomHumanoidScoonerReinforcement
  name: Scooner
  components:
    - type: Sprite
      sprite: Structures/Decoration/banner.rsi
      state: banner_syndicate
    - type: RandomHumanoidSpawner
      settings: ScoonerReinforcementSettings

- type: randomHumanoidSettings
  id: ScoonerReinforcementSettings
  speciesBlacklist:
  - Diona
  - Felinid
  - Moth
  - Arachnid
  - Demon
  - SlimePerson
  - HumanoidXeno
  - Predator
  - Resomi
  parent: EventHumanoid
  components:
    - type: NpcFactionMember
      factions:
      - Pirate
    - type: PirateIcon
    - type: GhostRole
      name: ghost-role-information-pirate-name
      description: ghost-role-information-pirate-description
      rules: ghost-role-information-rules-team-antagonist
      mindRoles:
      - MindRoleGhostRoleTeamAntagonist
      raffle:
        settings: default
    - type: Loadout
      prototypes: [ PirateScoonerEVAGear ]
      roleLoadout: [ RoleSurvivalScooner ]
    - type: RandomMetadata
      nameSegments: [NamesDeathCommando]

