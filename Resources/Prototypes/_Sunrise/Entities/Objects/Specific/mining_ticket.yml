- type: currency
  id: MiningTicket
  displayName: currency-mining-ticket
  cash:
    1: MiningTicket
  canWithdraw: true

- type: entity
  parent: SalvageTicket
  id: MiningTicket
  name: mining ticket
  description: Exchange these tickets for mining equipment.
  components:
  - type: PhysicalComposition
    materialComposition:
      MiningTicket: 1
  - type: Stack
    stackType: MiningTicket
    count: 1
  - type: Sprite
    layers:
    - state: icon
      map: ["base"]
      color: "#9be792"
  - type: Currency
    price:
      MiningTicket: 1
  - type: CargoSellBlacklist

- type: material
  id: MiningTicket
  name: material-mining-ticket
  unit: materials-unit-tickets
  stackEntity: MiningTicket
  icon: { sprite: /Textures/_Sunrise/Objects/Economy/salvage_ticket.rsi, state: icon }
  price: 1

- type: stack
  id: MiningTicket
  name: stack-mining-ticket
  icon: { sprite: /Textures/_Sunrise/Objects/Economy/salvage_ticket.rsi, state: icon }
