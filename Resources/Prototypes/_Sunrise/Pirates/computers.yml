- type: entity
  id: ComputerCargoOrdersPirate
  parent: ComputerCargoOrders
  name: pirate request computer
  description: Used by pirates to purchase new booty.
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: rusted
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: requestpirate
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: CargoOrderConsole
    allowedGroups: [ "pirateMarket", "pirateMarketPirate", "pirateMarketFreelance", "pirateMarketBaron" ]
    account: Pirates
    announcementChannel: Pirate
    removeLimitAccess: [ "Pirate" ]
  - type: ActiveRadio
    channels:
    - Pirate
  - type: Computer
    board: PirateRequestComputerCircuitboard
  - type: PointLight
    color: "#c9c042"
  - type: AccessReader
    access: [["Pirate"]]

- type: entity
  id: ComputerPirateShipyard
  parent: BaseComputerShipyard
  name: pirate shipyard console
  description: Used to purchase and sell the shuttle linked to this console.
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: rusted
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shuttlepirate
    - map: ["computerLayerKeys"]
      sprite: Structures/Machines/computers.rsi
      state: syndie_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: ShipyardConsole
    account: Pirates
    vesselGroup: pirate
    announcementChannel: Pirate
  - type: Computer
    board: PirateShipyardComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#a15608"
  - type: AccessReader
    access: [["Pirate"]]

