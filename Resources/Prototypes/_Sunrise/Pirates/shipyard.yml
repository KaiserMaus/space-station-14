- type: cargoProduct
  id: PirateShipVoucherFalcon
  icon:
    sprite: Objects/Misc/module.rsi
    state: id_mod
  product: PirateShuttleVoucherFalcon
  cost: 15000
  category: pirateproduct-category-name-shuttles
  group: pirateShipyard

