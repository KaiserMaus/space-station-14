- type: entity
  abstract: true
  parent: BaseGameRule
  id: BasePiratesRule
  components:
  - type: PiratesRule
  - type: RuleGrids
  - type: AntagSelection
    agentName: pirate-list-start
  - type: AntagLoadProfileRule
  - type: DynamicRuleCost
    cost: 150

- type: entity
  parent: BasePiratesRule
  id: Pirates
  components:
  - type: LoadGridRule
    gridPath: /Maps/_Sunrise/Nonstations/pirate-cove.yml
  - type: GameRule
    minPlayers: 20
  - type: StationEvent
    earliestStart: 10
    minimumPlayers: 20
    duration: null
    reoccurrenceDelay: 60
    startAnnouncement: null
    maxOccurrences: 1
  - type: AntagSelection
    definitions:
    - prefRoles: [ PirateCaptain ]
      fallbackRoles: [ PirateCrew ]
      spawnerPrototype: SpawnPointPirateCaptain
      pickPlayer: false
      min: 1
      max: 1
      briefing:
        text: pirate-role-greeting
        color: "#a15608"
        sound:
          path: "/Audio/Ambience/Antag/pirate_start.ogg"
          params:
            volume: -12
      components:
      - type: PirateAccent
      - type: PirateIcon
      - type: RandomMetadata
        nameSegments:
        - NamesDeathCommando
        nameFormat: name-format-pirate-captain
      - type: NpcFactionMember
        factions:
        - Pirate
      mindRoles:
      - MindRolePirateCaptain
    - prefRoles: [ PirateCrew ]
      fallbackRoles: [ PirateCaptain ]
      spawnerPrototype: SpawnPointPirateCrew
      pickPlayer: false
      min: 2
      max: 8
      playerRatio: 10
      briefing:
        text: pirate-role-greeting
        color: "#a15608"
        sound:
          path: "/Audio/Ambience/Antag/pirate_start.ogg"
          params:
            volume: -12
      components:
      - type: PirateAccent
      - type: PirateIcon
      - type: RandomMetadata
        nameSegments:
        - NamesDeathCommando
        nameFormat: name-format-pirate-crew
      - type: NpcFactionMember
        factions:
        - Pirate
      mindRoles:
      - MindRolePirate
    - prefRoles: [ PirateCrew ]
      fallbackRoles: [ PirateCaptain ]
      spawnerPrototype: SpawnPointPirateCrew
      pickPlayer: false
      min: 0
      max: 1
      playerRatio: 80
      briefing:
        text: pirate-role-greeting
        color: "#a15608"
        sound:
          path: "/Audio/Ambience/Antag/pirate_start.ogg"
          params:
            volume: -12
      components:
      - type: PirateAccent
      - type: PirateIcon
      - type: RandomMetadata
        nameSegments:
        - NamesDeathCommando
        nameFormat: name-format-pirate-crew
      - type: NpcFactionMember
        factions:
        - Pirate
      mindRoles:
      - MindRolePirate
