- type: entity
  abstract: true
  id: BaseStationPirateCargo
  components:
  - type: StationBankAccount
    increasePerSecond: 0
    revenueDistribution:
      Pirates: 1
    accounts:
      Pirates: 1000
    lockboxCut: 1
    primaryCut: 1
    primaryAccount: Pirates
  - type: StationCargoOrderDatabase
    markets:
    - pirateMarket
    orders:
      Pirates: []
  - type: SalvageJobsData
    rankUpAnnouncement: pirate-job-board-radio-announce
    rankUpChannel: Pirate
    rankThresholds:
      0:
        title: pirate-job-rank-title-0
        bountyGroup: PirateBountyScrapper
      3:
        title: pirate-job-rank-title-1
        bountyGroup: PirateBountyPirate
        unlockedMarket: pirateMarketPirate
      6:
        title: pirate-job-rank-title-2
        bountyGroup: PirateBountyFreelancer
        unlockedMarket: pirateMarketFreelance
    maxRank:
      title: pirate-job-rank-title-MAX
      unlockedMarket: pirateMarketBaron

- type: entity
  id: PirateShuttleStation
  parent:
  - BaseStation
  - BaseStationPirateCargo
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
  - type: PirateStation
