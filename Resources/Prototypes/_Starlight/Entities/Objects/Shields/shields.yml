- type: entity
  name: improvised shield
  parent: [ BasePaladinShield, BaseMinorContraband ]
  id: ImprovisedShield
  description: Steel welded together in a interlocking pattern to hold up better to various kinds of blows. Don't expect it to do well in a gunfight, however.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Melee/improvised_shield.rsi
      state: base
    - type: Item
      sprite: _Starlight/Objects/Weapons/Melee/improvised_shield.rsi
    - type: Clothing
      sprite: _Starlight/Objects/Weapons/Melee/improvised_shield.rsi
    # Sunrise edit start - use flat reductions
    - type: Blocking
      passiveBlockModifier:
        flatReductions:
          Blunt: 6
          Slash: 9
          Piercing: 3
          Heat: 1
    # Sunrise edit end
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 10
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 60
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetSteel1:
                  min: 2
                  max: 10
    - type: Construction
      graph: ImprovisedShieldGraph
      node: start
    - type: StaticPrice
      price: 560
