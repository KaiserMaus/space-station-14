- type: entity
  abstract: true
  parent: [ BaseRepairableShield, BaseGinormousShield ]
  id: BasePaladinShield
  components:
    - type: Clothing
      quickEquip: false
      slots:
      - Back
      - suitStorage
    - type: Item
      heldPrefix: null
    - type: ClothingSpeedModifier
      sprintModifier: 0.95
    # Sunrise edit start - use the passive reduction while raised
    # - type: Blocking
    #   activeBlockModifier:
    #     flatReductions:
    #       Blunt: 1
    #       Slash: 1
    #       Piercing: 1
    #       Heat: 1
    # Sunrise edit end
    - type: MeleeWeapon
      soundHit:
        path: "/Audio/Weapons/smash.ogg"

- type: entity
  name: paladin shield
  parent: [ BasePaladinShield, BaseMajorContraband ]
  id: PaladinShield
  description: A shield for a true paladin! Good at deflecting hits with swords and absorbing the impact from bats, but not much else.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Melee/paladin_shield.rsi
      state: base
    - type: Item
      sprite: _Starlight/Objects/Weapons/Melee/paladin_shield.rsi
    - type: Clothing
      sprite: _Starlight/Objects/Weapons/Melee/paladin_shield.rsi
    # Sunrise edit start - use flat reductions
    - type: Blocking
      passiveBlockModifier:
        flatReductions:
          Blunt: 12
          Slash: 15
          Piercing: 6
          Heat: 3
    # Sunrise edit end
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 14 #Bonk!
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 160
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 120
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetPlasteel1:
                  min: 4
                  max: 13
                SheetSteel1:
                  min: 5
                  max: 13
    - type: StaticPrice
      price: 560

- type: entity
  name: paladin greatshield
  parent: [ BasePaladinShield, BaseMajorContraband ]
  id: PaladinShieldGreat
  description: You're up against the wall and I! AM! THE! FUCKING! WALL!
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Melee/paladin_greatshield.rsi
      state: base
    - type: Item
      sprite: _Starlight/Objects/Weapons/Melee/paladin_greatshield.rsi
    - type: Clothing
      sprite: _Starlight/Objects/Weapons/Melee/paladin_greatshield.rsi
    # Sunrise edit start - use flat reductions
    - type: Blocking
      passiveBlockModifier:
        flatReductions:
          Blunt: 15
          Slash: 15
          Piercing: 12
          Heat: 3
    # Sunrise edit end
    - type: MeleeWeapon
      attackRate: 0.50 # Large and heavy but god help you if someone hits you with this thing.
      damage:
        types:
          Blunt: 20
    - type: ClothingSpeedModifier
      walkModifier: 0.7
      sprintModifier: 0.5
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 300
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 200 #Combined with damage resistances, IF raised, can tank 5 lector magdumps before finally breaking. You will STAM CRIT before then. If just held, or a laser is used it'll function like a normal shield more or less.
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetPlasteel1:
                  min: 6
                  max: 20
                SheetSteel1:
                  min: 4
                  max: 15
                SheetGlass1:
                  min: 2
                  max: 3
    - type: StaticPrice
      price: 830

- type: entity
  abstract: true
  parent: [ BasePaladinShield, BaseMinorContraband ]
