      sprite: _Starlight/Objects/Weapons/Melee/forged_buckler_shield.rsi
      state: base
    - type: Item
      sprite: _Starlight/Objects/Weapons/Melee/forged_buckler_shield.rsi
    - type: Clothing
      sprite: _Starlight/Objects/Weapons/Melee/forged_buckler_shield.rsi
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 12
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 140
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetPlasteel1:
                  min: 2
                  max: 6
                SheetSteel1:
                  min: 1
                  max: 4
    - type: StaticPrice
